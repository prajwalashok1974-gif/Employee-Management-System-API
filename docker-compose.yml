services:
  db:
    image: postgres:18
    container_name: employee_postgres
    restart: always
    environment:
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: employee_password
      POSTGRES_DB: employee_db
    ports:
      - "5433:5432"
    volumes:
      - employee_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_user -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: employee_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://employee_user:employee_password@db:5432/employee_db
      SECRET_KEY: replace_with_a_secure_secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  employee_data:
